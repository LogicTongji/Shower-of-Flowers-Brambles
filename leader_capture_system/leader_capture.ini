[General]
; Default retail/canonical process name.
ProcessName=hoi3_tfh.exe

; Optional semicolon-separated additional compatible process names.
; Keep empty unless you intentionally renamed a structurally compatible TFH 4.02 executable.
; Example: CompatibleProcessNames=hoi3_tfh.exe;hoi3_tfh_mod.exe
CompatibleProcessNames=hoi3_tfh.exe

; Recommended mode: start HOI3 yourself, reach the main menu, then run START_LEADER_CAPTURE.bat.
AutoLaunch=0

; Used only when AutoLaunch=1. May be blank, relative to this launcher, or absolute.
GameExe=
WaitMs=60000
